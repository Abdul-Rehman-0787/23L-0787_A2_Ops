{% extends "base.html" %}
{% block title %}Log in | VisionGuard{% endblock %}
{% block content %}
<section class="section narrow">
  <div class="glass auth-card">
    <p class="eyebrow">Welcome back</p>
    <h2>Log in</h2>
    {% if error %}<div class="form-error" role="alert">{{ error }}</div>{% endif %}
    <form class="auth-form" method="post" action="/login">
      <input type="hidden" name="next" value="{{ next }}">
      <label>Email
        <input type="email" name="email" value="{{ email }}" required autocomplete="email" maxlength="255">
      </label>
      <label>Password
        <input type="password" name="password" required autocomplete="current-password">
      </label>
      <button class="btn btn-glow" type="submit">Continue</button>
    </form>
    <p class="auth-links muted">We will email you a 6-digit code to finish logging in.</p>
    <p class="auth-links muted">New here? <a href="/register">Create an account</a></p>
  </div>
</section>
{% endblock %}
