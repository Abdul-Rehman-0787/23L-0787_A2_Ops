{% extends "base.html" %}
{% block title %}Create account | VisionGuard{% endblock %}
{% block content %}
<section class="section narrow">
  <div class="glass auth-card">
    <p class="eyebrow">Create account</p>
    <h2>Start analysing images</h2>
    {% if error %}<div class="form-error" role="alert">{{ error }}</div>{% endif %}
    <form class="auth-form" method="post" action="/register">
      <label>Email
        <input type="email" name="email" value="{{ email }}" required autocomplete="email" maxlength="255">
      </label>
      <label>Password (at least 8 characters)
        <input type="password" name="password" required minlength="8" autocomplete="new-password">
      </label>
      <button class="btn btn-glow" type="submit">Create account</button>
    </form>
    <p class="auth-links muted">We will email you a 6-digit code to confirm it is you.</p>
    <p class="auth-links muted">Already have an account? <a href="/login">Log in</a></p>
  </div>
</section>
{% endblock %}
