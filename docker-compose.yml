name: visionguard

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # no "ports:" on purpose: only reachable inside the Compose network

  web:
    build: .
    image: visionguard:v1
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "5000:5000"
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      MODEL_PATH: /app/models/champion.keras
      MODEL_NAME: ${MODEL_NAME:-visionguard}
      MODEL_VERSION: ${MODEL_VERSION:-unknown}
      THRESHOLD: ${THRESHOLD:-0.5}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-5}
      HOST: 0.0.0.0
      PORT: "5000"
    volumes:
      - ./models:/app/models:ro

volumes:
  pgdata: