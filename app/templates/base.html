<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}VisionGuard | AI image detection{% endblock %}</title>
  <meta name="description" content="Find out whether an image is AI-generated or real.">
  <meta name="color-scheme" content="dark">
  <link rel="icon" href="{{ url_for('static', filename='logo.png') }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <noscript><style>.reveal,.fade{opacity:1!important;transform:none!important}</style></noscript>
</head>
<body>
  <div class="bg" aria-hidden="true">
    <span class="orb o1"></span><span class="orb o2"></span><span class="orb o3"></span>
    <span class="bg-grid"></span>
  </div>
  {% include "_header.html" %}
  <main>{% block content %}{% endblock %}</main>
  {% include "_footer.html" %}
  <script src="{{ url_for('static', filename='app.js') }}" defer></script>
</body>
</html>
