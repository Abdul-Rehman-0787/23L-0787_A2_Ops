name: CI/CD

on:
  push:
    branches: [deployed]
  pull_request:
  workflow_dispatch:

# Newer pushes cancel older PR runs, but never cancel a run that may be deploying.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.13"

jobs:
  # ---------------------------------------------------------------- 1. TEST
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install packages
        run: pip install -r requirements.txt pytest ruff
      - name: Lint
        run: ruff check app src tests run.py
      - name: Test
        run: pytest -q

  # --------------------------------------------------------------- 2. DOCKER
  # Proves the image builds. Render builds its own copy from the Dockerfile.
  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: visionguard:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Catches a missing dependency or a missing baked-in index before Render does.
      - name: Smoke test the image
        run: |
          docker run --rm visionguard:ci python -c "import app.routes"
          docker run --rm visionguard:ci test -d /app/instance/chroma

  # -------------------------------------------------------------- 3. DEPLOY
  # Runs only for pushes to `deployed`, and only after test + docker pass.
  # `main` (frozen assignment) and `platform` (local development) are never deployed from here.
  # Switch: repository variable DEPLOY_ENABLED must be "true", so CI can go green
  # before the Render services exist.
  deploy:
    needs: [test, docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/deployed' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    env:
      RENDER_DEPLOY_HOOK_WEB: ${{ secrets.RENDER_DEPLOY_HOOK_WEB }}
      RENDER_DEPLOY_HOOK_API: ${{ secrets.RENDER_DEPLOY_HOOK_API }}
      RENDER_DEPLOY_HOOK_MODEL_V1: ${{ secrets.RENDER_DEPLOY_HOOK_MODEL_V1 }}
      APP_URL: ${{ vars.APP_URL }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check required settings
        run: |
          [ -n "$RENDER_DEPLOY_HOOK_WEB" ] || { echo "::error::Secret RENDER_DEPLOY_HOOK_WEB is not set"; exit 1; }
          [ -n "$APP_URL" ] || { echo "::error::Repository variable APP_URL is not set"; exit 1; }

      - name: Deploy web app (this commit)
        run: curl -fsS -X POST "${RENDER_DEPLOY_HOOK_WEB}&ref=${GITHUB_SHA}" > /dev/null

      - name: Deploy model API (only if api/ changed)
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_API" ]; then
            echo "No API hook configured, skipping."; exit 0
          fi
          if git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" 2>/dev/null | grep -q '^api/'; then
            curl -fsS -X POST "${RENDER_DEPLOY_HOOK_API}&ref=${GITHUB_SHA}" > /dev/null
            echo "API redeploy triggered."
          else
            echo "api/ unchanged, skipping."
          fi

      - name: Deploy second model API (only if api_v1/ changed)
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_MODEL_V1" ]; then
            echo "No model-v1 hook configured, skipping."; exit 0
          fi
          if git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" 2>/dev/null | grep -q '^api_v1/'; then
            curl -fsS -X POST "${RENDER_DEPLOY_HOOK_MODEL_V1}&ref=${GITHUB_SHA}" > /dev/null
            echo "Model v1 redeploy triggered."
          else
            echo "api_v1/ unchanged, skipping."
          fi

      - name: Wait for /health (Render builds, then cold-starts)
        run: |
          for i in $(seq 1 40); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$APP_URL/health" || true)
            echo "attempt $i: HTTP $code"
            if [ "$code" = "200" ]; then echo "Deploy is healthy."; exit 0; fi
            sleep 20
          done
          echo "::error::$APP_URL/health did not return 200 within ~13 minutes"
          exit 1